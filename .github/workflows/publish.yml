name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" || pip install -e .
      # This job is the release gate for PyPI and npm. It must be able to
      # fail. Never suffix it with a success-swallowing shell guard, and
      # never let the publish jobs run unconditionally. See card 62a5256d.
      - run: python -m pytest tests/ -v --tb=short
      - name: Tag must equal the package version
        run: |
          want="v$(python -c 'import skskills; print(skskills.__version__)')"
          test "$GITHUB_REF_NAME" = "$want" || { echo "tag $GITHUB_REF_NAME != $want"; exit 1; }

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    # npm trusted publishing (OIDC): no stored token; provenance is signed.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm 11.5.1 or newer (trusted publishing)
        run: npm install -g npm@^11.5.1
      - name: Publish to npm
        run: npm publish --provenance --access public
