      silent wedges the process-up checks miss (Telegram bridge ConnectTimeout hang,
      dead receive-tree). Stdlib-only; transport seam is unit-tested with a mock.
    tags: [canary, monitoring, telegram, sk-alert, heartbeat, round-trip, probe]
    category: monitoring

