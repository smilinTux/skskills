# ── Plugin views (Anthropic envelope grouping) ──────────────────────────────
plugins:
  - name: skcomms
    axis: component
    version: "0.1.0"
    description: >
      Sovereign encrypted comms — inline skchat, presence, groups, over the
      capauth-signed transport. Thin front-ends over the skchat MCP server.
    author:
      name: "Chef & Lumina"
    include_tags: [skchat, messaging, p2p, mcp]
    include_names: [chat]
    publish: false
